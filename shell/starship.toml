# Starship 提示符配置 - 经典极简现代风

add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$package\
$golang\
$nodejs\
$rust\
$python\
$docker_context\
$custom\
$cmd_duration\
$line_break\
$character"""

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"
read_only = " 🔒"

[git_branch]
style = "bold purple"
format = "[$symbol$branch]($style) "
symbol = "🌱 "

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'

[nodejs]
symbol = "⬢ "
style = "bold green"
format = "[$symbol($version )]($style)"

[rust]
symbol = "🦀 "
style = "bold red"
format = "[$symbol($version )]($style)"

[golang]
symbol = "🐹 "
style = "bold cyan"
format = "[$symbol($version )]($style)"

[python]
symbol = "🐍 "
style = "bold yellow"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2_000
style = "yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
