# Starship 提示符配置 - 简洁现代风

add_newline = true
format = """
[](color_orange)\
$os\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
$git_metrics\
[](fg:color_aqua bg:color_blue)\
$c\
$rust\
$golang\
$nodejs\
$python\
[](fg:color_blue bg:color_bg3)\
$docker_context\
[](fg:color_bg3 bg:color_bg1)\
$time\
[](fg:color_bg1)\
$line_break$character"""

palette = 'gruvbox_dark'
[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"
format = '[ $symbol ]($style)'
[os.symbols]
Fedora = ""
Macos = ""
Linux = ""
Windows = ""
Arch = ""
Ubuntu = ""

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_red"
format = '[$user ]($style)'

[directory]
style = "bg:color_yellow fg:color_bg1"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = ".../"

[git_branch]
symbol = ""
style = "bg:color_aqua fg:color_fg0"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:color_aqua fg:color_fg0"
format = '[$all_status$ahead_behind ]($style)'

[git_metrics]
disabled = true

[c]
style = "bg:color_blue fg:color_fg0"
format = '[ $name($version) ]($style)'

[rust]
style = "bg:color_blue fg:color_fg0"
format = '[ $version ]($style)'

[golang]
style = "bg:color_blue fg:color_fg0"
format = '[ $version ]($style)'

[nodejs]
style = "bg:color_blue fg:color_fg0"
format = '[ $version ]($style)'

[python]
style = "bg:color_blue fg:color_fg0"
format = '[ $version ]($style)'

[docker_context]
style = "bg:color_bg3 fg:color_fg0"
format = '[ $context ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1 fg:color_fg0"
format = '[ $time ]($style)'

[character]
success_symbol = "[❯](color_green)"
error_symbol = "[❯](color_red)"
vimcmd_symbol = "[❮](color_green)"
