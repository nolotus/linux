<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fonts:dtd:fontconfig.dtd">
<fontconfig>

  <!-- 渲染：subpixel(LCD) 抗锯齿 + LCD filter，接近 macOS 的实边观感。
       注意（2026-09-21 像素级实测，带正负对照组）：GTK4/libadwaita 原生应用
       在 Wayland 下仍渲染为灰度，此项对它们无效；只对 XWayland / Qt /
       Firefox / Chromium / Electron 等走 fontconfig/Xft 路径的程序生效。 -->
  <match target="font">
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdlight</const></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>

  <!-- 默认字体：中英混排时英文用 Inter，中文回退 MiSans / Noto CJK SC -->
  <!-- 修复：Fedora 65-0-google-noto-sans-cjk-vf 会把 CJK 顶到 sans-serif 最前， -->
  <!-- 导致英文也用 CJK 拉丁字形。prepend Inter 确保西文优先 -->
  <!-- Inter 相对 Adwaita Sans：x 高更大、字面率更高、笔画更重，观感接近 SF Pro -->
<match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <!-- 中文回退：MiSans 优先（较 Noto 更圆润），Noto 兜底生僻字 -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>MiSans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>

  <!-- 终端 / 等宽环境：优先 JetBrainsMono Nerd Font -->
  <match target="pattern">
    <test name="family"><string>JetBrains Mono</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- 把难看的 Droid Sans Fallback 替换为 Noto Sans CJK SC -->
  <match target="pattern">
    <test name="family"><string>Droid Sans Fallback</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>MiSans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <!-- 常见程序请求的中文字体名统一到 Noto CJK SC -->
  <match target="pattern">
    <test name="family"><string>宋体</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SimSun</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>黑体</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>MiSans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SimHei</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>MiSans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>MiSans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>MiSans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

</fontconfig>
