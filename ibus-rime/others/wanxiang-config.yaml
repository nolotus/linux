# 万象语法模型替代配置（420MB，与雾凇词库紧耦合，准确度最高）
# 如改用万象，把以下内容合并到 rime_ice.custom.yaml 的 patch 下，
# 并把模型文件放到 ~/.config/ibus/rime/wanxiang-lts-zh-hans.gram
#
# 下载：
#   curl -L -o ~/.config/ibus/rime/wanxiang-lts-zh-hans.gram \
#     https://gh-proxy.com/https://github.com/amzxyz/RIME-LMDG/releases/download/LTS/wanxiang-lts-zh-hans.gram
#
# 配置（替换八股文相关字段）：
#   grammar:
#     language: wanxiang-lts-zh-hans
#     collocation_max_length: 6
#     collocation_min_length: 3
#     collocation_penalty: -14
#     non_collocation_penalty: -6
#     weak_collocation_penalty: -100
#     rear_penalty: -20
#   translator/contextual_suggestions: false
#   translator/max_homophones: 8
